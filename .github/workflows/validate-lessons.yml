name: Validate Python lessons
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile all lesson files
        run: python -m compileall -q lesson-01 lesson-02 lesson-03 lesson-04
      - name: Install pytest
        run: python -m pip install pytest
      - name: Run existing pytest suites if present
        shell: bash
        run: |
          for lesson in lesson-01 lesson-02 lesson-03 lesson-04; do
            if [ -d "$lesson/tests" ] && find "$lesson/tests" -name 'test_*.py' | grep -q .; then
              (cd "$lesson" && python -m pytest -q)
            else
              echo "::notice::$lesson has no pytest tests; compilation only"
            fi
          done
